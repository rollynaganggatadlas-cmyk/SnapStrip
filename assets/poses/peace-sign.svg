<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C9A3"/>
      <stop offset="1" stop-color="#E8AE85"/>
    </linearGradient>
  </defs>
  <!-- palm -->
  <rect x="60" y="100" width="80" height="85" rx="28" fill="url(#skin2)" stroke="#B98B5E" stroke-width="2"/>
  <!-- two fingers up (V) -->
  <rect x="72" y="20" width="22" height="90" rx="11" fill="url(#skin2)" stroke="#B98B5E" stroke-width="2" transform="rotate(-12 83 65)"/>
  <rect x="108" y="20" width="22" height="90" rx="11" fill="url(#skin2)" stroke="#B98B5E" stroke-width="2" transform="rotate(12 119 65)"/>
  <!-- folded fingers -->
  <rect x="62" y="120" width="22" height="36" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <rect x="118" y="120" width="22" height="36" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <rect x="62" y="156" width="22" height="26" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <!-- sparkles -->
  <text x="28" y="50" font-size="22" fill="#D4AF37">✦</text>
  <text x="152" y="70" font-size="18" fill="#D4AF37">✧</text>
</svg>