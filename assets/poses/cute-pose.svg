<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C9A3"/>
      <stop offset="1" stop-color="#E8AE85"/>
    </linearGradient>
  </defs>
  <!-- face circle -->
  <circle cx="100" cy="100" r="52" fill="#FBE0C8" stroke="#B98B5E" stroke-width="2"/>
  <!-- eyes (happy) -->
  <path d="M78 92 Q 84 86 90 92" stroke="#75513B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M110 92 Q 116 86 122 92" stroke="#75513B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M86 114 Q 100 128 114 114" stroke="#B22222" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="76" cy="108" rx="7" ry="4" fill="#F2A6A6" opacity="0.7"/>
  <ellipse cx="124" cy="108" rx="7" ry="4" fill="#F2A6A6" opacity="0.7"/>
  <!-- left hand beside cheek -->
  <rect x="30" y="92" width="34" height="72" rx="17" fill="url(#skin4)" stroke="#B98B5E" stroke-width="2" transform="rotate(18 47 128)"/>
  <!-- right hand beside cheek -->
  <rect x="136" y="92" width="34" height="72" rx="17" fill="url(#skin4)" stroke="#B98B5E" stroke-width="2" transform="rotate(-18 153 128)"/>
  <!-- sparkles -->
  <text x="24" y="60" font-size="20" fill="#D4AF37">✦</text>
  <text x="158" y="60" font-size="20" fill="#D4AF37">✦</text>
</svg>