<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C9A3"/>
      <stop offset="1" stop-color="#E8AE85"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- palm -->
  <rect x="70" y="95" width="70" height="85" rx="26" fill="url(#skin)" stroke="#B98B5E" stroke-width="2"/>
  <!-- pointing finger -->
  <rect x="98" y="20" width="22" height="90" rx="11" fill="url(#skin)" stroke="#B98B5E" stroke-width="2" filter="url(#glow)"/>
  <!-- folded fingers -->
  <rect x="72" y="105" width="22" height="34" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <rect x="118" y="105" width="22" height="30" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <rect x="118" y="138" width="22" height="28" rx="10" fill="#E8AE85" stroke="#B98B5E" stroke-width="2"/>
  <!-- sparkle -->
  <text x="150" y="40" font-size="28" fill="#D4AF37">✦</text>
</svg>